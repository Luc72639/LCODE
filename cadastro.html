<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Criar conta — Clínica Vida+</title><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script></head><body class="login-page"><main class="login-container"><section class="login-card" style="width:min(620px,100%)"><div class="login-brand"><div class="login-logo">Vida<span>+</span></div><span class="login-label">CADASTRO DE PACIENTE</span></div><div class="login-header"><h1>Crie sua conta</h1><p>Use seus dados para agendar consultas e acompanhar seu histórico.</p></div><form id="register-form"><div class="form-grid"><div class="form-field full"><label>Nome completo</label><input id="register-name" required></div><div class="form-field"><label>CPF</label><input id="register-cpf" placeholder="000.000.000-00"></div><div class="form-field"><label>Data de nascimento</label><input id="register-birth" type="date"></div><div class="form-field"><label>Telefone</label><input id="register-phone"></div><div class="form-field"><label>E-mail</label><input id="register-email" type="email" required></div><div class="form-field full"><label>Endereço</label><input id="register-address"></div><div class="form-field full"><label>Senha</label><input id="register-password" type="password" minlength="8" required><small style="color:var(--muted)">Use pelo menos 8 caracteres.</small></div></div><div class="modal-actions"><a href="login.html" class="btn btn-secondary">Já tenho conta</a><button id="register-button" class="btn btn-primary" type="submit">Criar conta</button></div></form><div class="auth-links"><a href="index.html">Voltar ao site</a></div></section></main><script src="ui.js"></script><script src="cadastro.js"></script></body></html>
